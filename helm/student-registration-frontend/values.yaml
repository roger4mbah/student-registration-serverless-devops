
replicaCount: 2

image:
  repository: student-registration-frontend
  tag: dev-hardened-v2
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

securityContext:
  runAsNonRoot: true
  runAsUser: 101
  allowPrivilegeEscalation: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

probes:
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 20

