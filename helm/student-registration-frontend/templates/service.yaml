
apiVersion: v1
kind: Service

metadata:
  name: {{ .Release.Name }}
  labels:
    app: student-registration-frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}

  selector:
    app: student-registration-frontend
    app.kubernetes.io/instance: {{ .Release.Name }}

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}

